<style>
body{margin:0;background:#FFFFFF}
a{color:#231F20}a:hover{color:#9A5A00}
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 24px}
.tl li{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0}
.tl .ph{font-family:Outfit,sans-serif;font-weight:600;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#9A5A00;height:18px;white-space:nowrap}
.tl .dot{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Outfit,sans-serif;font-weight:800;font-size:24px;background:#231F20;color:#FFFFFF;flex:none}
.tl .dot.o{background:#FFFFFF;color:#231F20;box-shadow:inset 0 0 0 3px #231F20}
.tl li::before{content:"";position:absolute;top:61px;left:64px;right:-24px;height:4px;border-radius:2px;background:#F89C1D}
.tl li.dash::before{background:repeating-linear-gradient(90deg,#F89C1D 0 10px,transparent 10px 18px)}
.tl li:last-child::before{display:none}
.tl h3{margin:4px 0 0;font-family:Outfit,sans-serif;font-weight:700;font-size:22px}
.tl p{margin:0;color:#4A4644;font-size:17px}
@media (max-width:960px){
.tl{grid-template-columns:minmax(0,1fr);gap:32px}
.tl li{padding-left:88px;min-height:64px;gap:6px}
.tl .dot{position:absolute;left:0;top:0}
.tl .ph{height:auto}
.tl li::before{top:68px;left:30px;right:auto;bottom:-28px;width:4px;height:auto}
.tl li.dash::before{background:repeating-linear-gradient(180deg,#F89C1D 0 10px,transparent 10px 18px)}
}
</style>
<style>html{scroll-behavior:smooth}*{box-sizing:border-box}img{max-width:100%}</style>
<style>
header{position:sticky;top:0;z-index:20}
[id]{scroll-margin-top:96px}
.menu-btn{display:none;align-items:center;justify-content:center;width:48px;height:48px;border:0;border-radius:999px;background:transparent;color:#231F20;cursor:pointer}
.menu-btn:focus-visible,header nav a:focus-visible{outline:3px solid #F89C1D;outline-offset:2px}
.menu-btn path{transition:transform .2s,opacity .2s;transform-box:view-box;transform-origin:12px 12px}
.menu-btn[aria-expanded="true"] .l1{transform:translateY(5px) rotate(45deg)}
.menu-btn[aria-expanded="true"] .l2{opacity:0}
.menu-btn[aria-expanded="true"] .l3{transform:translateY(-5px) rotate(-45deg)}
@media (max-width:760px){
.menu-btn{display:inline-flex}
header nav{display:none!important;width:100%;flex-direction:column;align-items:stretch!important;gap:0!important;padding:4px 0 12px}
header nav.open{display:flex!important}
header nav a{padding:14px 4px!important;border-top:1px solid #ECEAE6;font-size:17px}
header nav a:last-child{margin-top:12px;border-top:0;text-align:center;padding:14px 22px!important}
header > div{padding-top:10px!important;padding-bottom:10px!important}
header > div > a img{height:48px!important}
section > div{padding-top:28px!important;padding-bottom:40px!important;gap:28px!important}
[id]{scroll-margin-top:68px}
h1{font-size:34px!important}
h2{font-size:30px!important}
h2 img{height:96px!important}
.tl h3{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.menu-btn path{transition:none}}
</style>
</head>

<a href="index.html" style="text-decoration: none; background: #231F20; color: #FFFFFF; font-weight: 700; padding: 15px 28px; border-radius: 999px">Zpět na web</a>
</div>
</main>
